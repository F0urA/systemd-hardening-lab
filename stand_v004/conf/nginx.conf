user labweb labweb;
worker_processes 2;
pid /run/slab-nginx.pid;
error_log /var/log/slab-nginx-error.log notice;

events { worker_connections 1024; }

http {
    access_log off;
    default_type application/octet-stream;
    sendfile on;
    server {
        listen 127.0.0.1:808;
        server_name localhost;
        root /var/lib/systemd-lab/nginx-www;
        index index.html;
        location / { try_files $uri $uri/ =404; }
    }
}
