[Service]
# P1
PrivateTmp=yes
ProtectHome=yes
ProtectSystem=full
NoNewPrivileges=yes
InaccessiblePaths=/etc/systemd-lab/credential

# P2
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes

# P3: строгий профиль
ProtectControlGroups=yes
ProtectProc=invisible
PrivateMounts=yes
RestrictNamespaces=yes

RestrictAddressFamilies=AF_UNIX AF_INET

# Намеренно удаляем все capabilities.
# Проверяем, сможет ли Nginx сохранить штатную работу.
CapabilityBoundingSet=CAP_NET_BIND_SERVICE CAP_SETUID CAP_SETGID

SystemCallFilter=~@mount @reboot @swap @module @raw-io @debug
SystemCallErrorNumber=EPERM

MemoryDenyWriteExecute=yes
LockPersonality=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
# v003: P6 = P4 + read-only file system with explicit write paths
ProtectSystem=strict
ReadWritePaths=/run -/var/log/slab-nginx-error.log -/var/spool/nginx/tmp/client -/var/spool/nginx/tmp/fastcgi -/var/spool/nginx/tmp/proxy -/var/spool/nginx/tmp/scgi -/var/spool/nginx/tmp/uwsgi
