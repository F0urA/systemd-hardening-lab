[Service]
PrivateTmp=yes
ProtectHome=yes
ProtectSystem=full
NoNewPrivileges=yes
InaccessiblePaths=/etc/systemd-lab/credential
# v004: P1r = P1 + read-only web directory
ReadOnlyPaths=/var/lib/systemd-lab/nginx-www
# v004: P1c = P1r + the capability set of P4
CapabilityBoundingSet=CAP_NET_BIND_SERVICE CAP_SETUID CAP_SETGID
