[Service]
PrivateTmp=yes
ProtectHome=yes
ProtectSystem=full
NoNewPrivileges=yes
InaccessiblePaths=/etc/systemd-lab/credential
# v004: P1r = P1 + read-only web directory
ReadOnlyPaths=/var/lib/systemd-lab/nginx-www
# v005 ablation: P1c base + CAP_DAC_OVERRIDE
CapabilityBoundingSet=CAP_NET_BIND_SERVICE CAP_SETUID CAP_SETGID CAP_DAC_OVERRIDE
